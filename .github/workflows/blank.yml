name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker (optional, if needed for private images)
      # uses: docker/login-action@v2
      # with:
      #   username: ${{ secrets.DOCKER_USERNAME }}
      #   password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and run tests
      run: |
        docker-compose -f docker-compose-test.yaml up --build --abort-on-container-exit

    - name: Capture test exit code
      run: |
        TEST_EXIT_CODE=$(docker inspect auraresenha_app_test --format='{{.State.ExitCode}}')
        echo "Tests finished with exit code $TEST_EXIT_CODE"
        exit $TEST_EXIT_CODE

    - name: Tear down containers
      if: always()
      run: docker-compose -f docker-compose-test.yaml down
